name: Deploy AWS Production

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Build and deploy to AWS
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: web

    env:
      AWS_REGION: us-east-1
      S3_BUCKET: mcospapas-site-prod
      CLOUDFRONT_DISTRIBUTION_ID: E3BOWBQ0Q2TMRG
      NEXT_PUBLIC_JOIN_API_URL: https://lxyf3negm2.execute-api.us-east-1.amazonaws.com/join

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::720881263377:role/GitHubActionsDeployMcOsPapasSiteRole
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync static files to S3
        run: |
          aws s3 sync out/ s3://${S3_BUCKET} --delete

      - name: Set no-cache headers for HTML files
        run: |
          aws s3 cp out/ s3://${S3_BUCKET}/ \
            --recursive \
            --exclude "*" \
            --include "*.html" \
            --cache-control "no-cache, no-store, must-revalidate" \
            --metadata-directive REPLACE

      - name: Set no-cache headers for TXT files
        run: |
          aws s3 cp out/ s3://${S3_BUCKET}/ \
            --recursive \
            --exclude "*" \
            --include "*.txt" \
            --cache-control "no-cache, no-store, must-revalidate" \
            --metadata-directive REPLACE

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${CLOUDFRONT_DISTRIBUTION_ID} \
            --paths "/*"
