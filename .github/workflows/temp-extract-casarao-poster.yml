name: Temporary Casarao Poster Frames

on:
  push:
    branches:
      - fix/filantropia-poster-video-02
    paths:
      - .github/workflows/temp-extract-casarao-poster.yml

permissions:
  contents: read

jobs:
  extract-frames:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract representative frames
        shell: bash
        run: |
          set -euo pipefail
          VIDEO="web/public/images/filantropia/casarao-dos-idosos/video_02.mp4"
          mkdir -p /tmp/casarao-poster-candidates
          duration="$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$VIDEO")"
          for percent in 10 20 30 40 50 60 70 80 90; do
            timestamp="$(awk -v d="$duration" -v p="$percent" 'BEGIN { printf "%.3f", d * p / 100 }')"
            ffmpeg -hide_banner -loglevel error -ss "$timestamp" -i "$VIDEO" -frames:v 1 -q:v 2 "/tmp/casarao-poster-candidates/frame-${percent}.jpg"
          done

      - name: Upload candidate frames
        uses: actions/upload-artifact@v4
        with:
          name: casarao-poster-candidates
          path: /tmp/casarao-poster-candidates/*.jpg
          if-no-files-found: error
          retention-days: 1
